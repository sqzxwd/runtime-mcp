[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runtime-mcp"
version = "0.1.0"
description = "Live runtime MCP bridge for AI agents: DB schema, HTTP error proxy, and log stack traces"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "anyio>=4.0.0",
]

[project.scripts]
runtime-mcp = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
